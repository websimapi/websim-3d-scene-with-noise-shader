<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>First Person Game with Noise Effect</title>
  <style>
    body { 
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    canvas { 
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 5px;
      pointer-events: none;
    }
    #instructions.visible {
      display: block;
    }
    #instructions.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="instructions" class="visible">
    <h1>First Person Explorer</h1>
    <p>Click to start</p>
    <p>WASD to move</p>
    <p>Mouse to look around</p>
    <p>ESC to pause</p>
  </div>
  <script type="module" src="main.js"></script>
