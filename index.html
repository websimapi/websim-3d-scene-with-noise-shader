<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Scene with Noise Shaders</title>
  <style>
    body { margin: 0; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #controls {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      color: white;
      font-family: Arial, sans-serif;
    }
    #pauseButton {
      padding: 10px 20px;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    #pauseButton:hover {
      background-color: rgba(255, 255, 255, 0.9);
    }
    .control-group {
      margin-bottom: 15px;
    }
    .control-group label {
      display: block;
      margin-bottom: 5px;
    }
    .control-group input[type="range"] {
      width: 200px;
    }
    .control-group input[type="number"] {
      width: 60px;
      padding: 5px;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="pauseButton">Pause</button>
    
    <div class="control-group">
      <label>Animation Speed</label>
      <input type="range" id="speedSlider" min="0" max="0.1" step="0.001" value="0.01">
      <input type="number" id="speedValue" min="0" max="0.1" step="0.001" value="0.01">
    </div>
    
    <div class="control-group">
      <label>Rotation Speed</label>
      <input type="range" id="rotationSlider" min="0" max="0.1" step="0.001" value="0.01">
      <input type="number" id="rotationValue" min="0" max="0.1" step="0.001" value="0.01">
    </div>
    
    <div class="control-group">
      <label>Object Scale</label>
      <input type="range" id="scaleSlider" min="0.1" max="2" step="0.1" value="1">
      <input type="number" id="scaleValue" min="0.1" max="2" step="0.1" value="1">
    </div>
    
    <div class="control-group">
      <label>Noise Speed</label>
      <input type="range" id="noiseSpeedSlider" min="1" max="30" step="1" value="10">
      <input type="number" id="noiseSpeedValue" min="1" max="30" step="1" value="10">
    </div>
  </div>
  <script type="module" src="main.js"></script>

</body>
</html>
